
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کورسو | Glimmer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Poetic, smoother flicker */
        @keyframes flicker {
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.95; filter: blur(0.5px); }
            25% { transform: scale(1.02, 0.98) translateY(-1px); opacity: 1; filter: blur(0px); }
            50% { transform: scale(0.98, 1.02) translateY(0); opacity: 0.85; filter: blur(1.5px); }
            75% { transform: scale(1.01) translateY(-0.5px); opacity: 0.98; filter: blur(0.2px); }
        }

        .animate-flicker {
            animation: flicker 3s ease-in-out infinite;
        }

        /* Gentle breathing for the ambient glow */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.2; transform: scale(1); filter: blur(120px); }
            50% { opacity: 0.45; transform: scale(1.15); filter: blur(150px); }
        }

        .animate-pulse-glow {
            animation: pulse-glow 8s ease-in-out infinite;
        }

        /* Masking for the background grains */
        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .vignette {
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        /* Custom selection color */
        ::selection {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        @keyframes float-text {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .float-subtle {
            animation: float-text 5s ease-in-out infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="relative bg-black overflow-hidden">
    <div class="fixed inset-0 bg-noise z-0"></div>
    <div class="fixed inset-0 vignette z-[1]"></div>
    <div id="root" class="relative z-10"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
